version: '3.8'

services:
  freshrss:
    image: freshrss/freshrss:latest
    container_name: freshrss-kelompok-3
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      TZ: Asia/Jakarta
      CRON_MIN: '1,31'
    volumes:
      - freshrss_data:/var/www/FreshRSS/data

volumes:
  freshrss_data:
